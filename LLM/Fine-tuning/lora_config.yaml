model_name_or_path: /path/to/your/base/llama2-model
template: default
finetuning_type: lora
do_train: true
do_eval: true
dataset: your_dataset_name_or_path
output_dir: output/llama2-lora-psychology
cutoff_len: 512
max_samples: 3000

per_device_train_batch_size: 8
per_device_eval_batch_size: 8
gradient_accumulation_steps: 4
num_train_epochs: 5
learning_rate: 6e-5
lr_scheduler_type: cosine
weight_decay: 0.01
warmup_ratio: 0.03
logging_steps: 20
save_steps: 300
evaluation_strategy: steps
eval_steps: 300
save_total_limit: 3

lora_rank: 8
lora_alpha: 32
lora_dropout: 0.05
lora_target: "q_proj,v_proj"  # or use ["q_proj", "v_proj"] if supported
quantization_bit: 4

fp16: true
plot_loss: true
overwrite_output_dir: true
logging_dir: logs/
report_to: "none"

load_best_model_at_end: true
metric_for_best_model: f1
greater_is_better: true